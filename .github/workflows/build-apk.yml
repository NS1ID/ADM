name: Build ADM+ Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Cefrium SDK requires Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local ARM64 aapt2 override
        run: sed -i '/aapt2FromMavenOverride/d; /ARM64 hosts only/d; /GitHub Actions workflow removes/d' gradle.properties

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Android Download Manager ADM+.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Download-Manager-ADM-Plus
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
