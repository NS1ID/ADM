#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Sat Nov 21 06:40:33 GMT 2026
android.nonTransitiveRClass=true
org.gradle.daemon.idletimeout=10800000
kotlin.code.style=official
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding\=UTF-8
android.useAndroidX=true
# ARM64 hosts only: Google's aapt2 is x86-64, so run it through qemu.
# The GitHub Actions workflow removes these lines automatically.
android.aapt2FromMavenOverride=/opt/aapt2/aapt2
